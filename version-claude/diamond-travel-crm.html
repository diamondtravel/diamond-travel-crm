<title>Diamond Travel CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: navy rail (sidebar on wide screens, header + bottom tabs on phones) framing a light working surface; gold reserved for brand marks and primary actions. */
:root{
  --navy:#0E1F3D; --navy-2:#182C55; --on-navy:#F2EFE6; --on-navy-muted:#A9B4CC;
  --gold:#B8913A; --gold-ink:#86661F; --gold-soft:#F3EBD7;
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#EEF1F6; --ink:#13213B; --muted:#5B6880; --line:#DCE1EB;
  --ok:#1D7149; --ok-soft:#E2F2E9; --warn:#9A5F0E; --warn-soft:#FBEFD9; --bad:#A93434; --bad-soft:#F8E3E3; --info:#2B4C8C; --info-soft:#E3EAF7;
  --shadow:0 1px 2px rgba(14,31,61,.06),0 6px 20px rgba(14,31,61,.06);
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Instrument Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --navy:#081226; --navy-2:#13234A; --on-navy:#F2EFE6; --on-navy-muted:#97A3BD;
  --gold:#D2AD5B; --gold-ink:#DDBB6E; --gold-soft:#2E2818;
  --bg:#0B1528; --surface:#111F3A; --surface-2:#172848; --ink:#E7EBF3; --muted:#9CA8C0; --line:#24365A;
  --ok:#5CC492; --ok-soft:#14352A; --warn:#E3A84E; --warn-soft:#3A2B12; --bad:#EE8080; --bad-soft:#3D1C22; --info:#8FB0EE; --info-soft:#1A2D52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#081226; --navy-2:#13234A; --on-navy:#F2EFE6; --on-navy-muted:#97A3BD;
  --gold:#D2AD5B; --gold-ink:#DDBB6E; --gold-soft:#2E2818;
  --bg:#0B1528; --surface:#111F3A; --surface-2:#172848; --ink:#E7EBF3; --muted:#9CA8C0; --line:#24365A;
  --ok:#5CC492; --ok-soft:#14352A; --warn:#E3A84E; --warn-soft:#3A2B12; --bad:#EE8080; --bad-soft:#3D1C22; --info:#8FB0EE; --info-soft:#1A2D52;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:flex;min-height:100%}
.rail{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand-name{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.01em;line-height:1.1;white-space:nowrap}
.brand-sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--on-navy-muted);min-width:0}
.me img{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gold)}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px}
main{flex:1;min-width:0;padding-block:20px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navy);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);border-top:1px solid rgba(210,173,91,.25)}
.tab{background:none;border:0;color:var(--on-navy-muted);padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--gold)}

@media (min-width:900px){
  .topbar,.tabs{display:none}
  .rail{display:flex;flex-direction:column;gap:28px;width:240px;flex:none;background:var(--navy);color:var(--on-navy);
    padding:26px 18px;padding-left:max(18px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;height:100dvh}
  .rail nav{display:flex;flex-direction:column;gap:4px}
  .rail .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:10px 12px;border-radius:8px}
  .rail .tab[aria-current="page"]{background:var(--navy-2);color:var(--gold)}
  .rail .me{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
  .rail .me span{max-width:150px}
  main{padding-block:32px 48px}
}

/* Type */
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,4vw,34px);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:16px;font-weight:600;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.muted{color:var(--muted)}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head > div{display:flex;flex-direction:column;gap:4px;min-width:0}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);
  padding:10px 16px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:#1A1406}
.btn-gold:hover{filter:brightness(1.05);border-color:var(--gold)}
.btn-danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.label{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;font-size:16px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-toggle{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface);font-size:13.5px;cursor:pointer;min-height:36px}
.chip-toggle[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}

/* Pills by stage */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-nuevo{background:var(--info-soft);color:var(--info)}
.st-contactado{background:var(--surface-2);color:var(--muted)}
.st-cotizado{background:var(--gold-soft);color:var(--gold-ink)}
.st-negociacion{background:var(--warn-soft);color:var(--warn)}
.st-ganado{background:var(--ok-soft);color:var(--ok)}
.st-perdido{background:var(--bad-soft);color:var(--bad)}
.tag-demo{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:1px 6px}

/* Surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-pad{padding:18px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v.money{font-size:20px}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:500}
.kpi.lead{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.kpi.lead .k{color:var(--on-navy-muted)}
.kpi.lead .v{color:var(--gold)}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.cols{grid-template-columns:1.2fr 1fr}}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clickable{cursor:pointer}
.clickable:hover .row-title{color:var(--gold-ink)}
.bar-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:1}
.bar-fill{height:100%;border-radius:99px;background:var(--navy-2)}
:root[data-theme="dark"] .bar-fill{background:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bar-fill{background:var(--gold)}}
.funnel-row{display:grid;grid-template-columns:130px 1fr 32px;gap:10px;align-items:center;font-size:13.5px;padding:6px 0}

/* Client list */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar .search{flex:1 1 220px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;min-height:42px;font-size:13.5px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.client-card{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:start}
.client-card:first-child{border-top:0}
.client-card:hover{background:var(--surface-2)}
.client-card .name{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.client-card .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.client-card .meta b{color:var(--ink);font-weight:600}

/* Funnel board */
.board-scroll{overflow-x:auto;margin-inline:-4px;padding:4px 4px 12px;-webkit-overflow-scrolling:touch}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:12px;min-width:min-content}
.col{background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:180px}
.col-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.col-sum{font-size:12px;color:var(--muted)}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mini .t{font-weight:600;cursor:pointer;overflow-wrap:anywhere}
.mini .s{font-size:12.5px;color:var(--muted)}
.mini select{min-height:38px;font-size:14px;padding:6px 8px}

/* Detail (boarding-pass header) */
.pass{background:var(--navy);color:var(--on-navy);border-radius:14px;display:grid;grid-template-columns:1fr;overflow:hidden}
.pass-main{padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.pass-name{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.pass-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pass-grid .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-navy-muted)}
.pass-grid .v{font-weight:600;overflow-wrap:anywhere}
.pass-stub{border-top:2px dashed rgba(210,173,91,.45);padding:16px 20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.pass-stub .budget{font-size:22px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
@media (min-width:760px){.pass{grid-template-columns:1fr 240px}.pass-stub{border-top:0;border-left:2px dashed rgba(210,173,91,.45);flex-direction:column;align-items:flex-start;justify-content:center}.pass-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.contact-line{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.contact-val{user-select:all;font-weight:600}
.timeline{display:flex;flex-direction:column;gap:0}
.tl-item{display:grid;grid-template-columns:14px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl-item::before{content:"";position:absolute;left:6px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--gold);background:var(--surface);margin-top:3px}
.tl-body{min-width:0;display:flex;flex-direction:column;gap:2px}
.tl-meta{font-size:12.5px;color:var(--muted)}
.tl-text{white-space:pre-wrap;overflow-wrap:anywhere}

/* Empty, banners, overlay, toast */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 20px}
.empty p{max-width:46ch;margin:0}
.banner{border-radius:10px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(6,12,26,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center;padding:24px}}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
@media (min-width:700px){.sheet{border-radius:16px}}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-body{padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sheet-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.confirm{max-width:440px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));z-index:200;background:var(--navy);color:var(--on-navy);border:1px solid var(--gold);
  padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.help{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-size:13px}

/* Logo */
.logo-rail{width:150px;height:auto;display:block;margin:0 auto}
.logo-top{height:44px;width:auto;display:block}
.rail .brand{flex-direction:column;align-items:center;gap:6px}
.crm-tag{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600}

/* Cotizaciones: lista y detalle */
.est-borrador{background:var(--surface-2);color:var(--muted)}
.est-enviada{background:var(--info-soft);color:var(--info)}
.est-aceptada{background:var(--ok-soft);color:var(--ok)}
.est-vencida{background:var(--warn-soft);color:var(--warn)}
.est-cancelada{background:var(--bad-soft);color:var(--bad)}
.q-card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:start}
.q-card:first-child{border-top:0}
.q-card:hover{background:var(--surface-2)}
.q-code{font-weight:700;font-variant-numeric:tabular-nums;color:var(--gold-ink);font-size:13px;letter-spacing:.04em}
.q-total{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.q-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.flag{font-size:11.5px;font-weight:600;color:var(--warn)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.kv{display:grid;grid-template-columns:minmax(110px,32%) 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}

/* Editor */
.sheet.wide{max-width:900px;height:92vh;height:92dvh}
.ed-tabs{display:flex;gap:4px;overflow-x:auto;padding:10px 18px 0;border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:2;background:var(--bg);-webkit-overflow-scrolling:touch}
.ed-tab{border:0;background:none;padding:10px 14px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;position:relative}
.ed-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.ed-tab .dot{position:absolute;top:8px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.ed-foot{margin-top:auto;position:sticky;bottom:0;z-index:3;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.ed-total{display:flex;flex-direction:column;line-height:1.2}
.ed-total b{font-size:19px;font-variant-numeric:tabular-nums}
.ed-total span{font-size:12px;color:var(--muted)}
.fieldset{display:flex;flex-direction:column;gap:14px}
.fs-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);font-weight:700;margin-top:6px}
.grid3{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.grid3{grid-template-columns:repeat(3,1fr)}}
.rowlist{display:flex;flex-direction:column;gap:10px}
.ritem{display:grid;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.ritem.tramo{grid-template-columns:1fr 1fr}
@media (min-width:720px){.ritem.tramo{grid-template-columns:140px 1.6fr .9fr .8fr .8fr auto}}
.ritem.serv{grid-template-columns:1fr auto auto}
.ritem.monto{grid-template-columns:1.6fr 1fr auto}
.ritem .input{min-height:40px;font-size:15px;padding:8px 10px}
.ritem label{font-size:11.5px;font-weight:600;color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{color:var(--bad);border-color:var(--bad)}
.toggle-inc{border:1px solid var(--line);border-radius:8px;min-height:40px;padding:0 10px;font-size:13px;font-weight:600;cursor:pointer;background:var(--ok-soft);color:var(--ok);white-space:nowrap}
.toggle-inc[aria-pressed="false"]{background:var(--surface-2);color:var(--muted)}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calc-row{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-top:1px solid var(--line);font-size:14px}
.calc-row:first-child{border-top:0}
.calc-row b{font-variant-numeric:tabular-nums}
.calc-total{background:var(--navy);color:var(--on-navy);padding:14px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.calc-total b{color:var(--gold);font-size:22px;font-variant-numeric:tabular-nums}
.price-line{display:flex;flex-direction:column;gap:4px}
.price-line .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

<script>
/* Diamond Travel CRM — motor de cotizaciones (cálculos, validación y PDF).
   Funciona en el navegador (window.DTCot) y en Node (module.exports) para pruebas. */
(function (root) {
"use strict";

const AGENCIA = {
  nombre: "Diamond Travel",
  whatsapp: "3052051183",
  whatsappTxt: "305 205 1183",
  direccion: "Calle 17 OE-48, barrio Caobos, Cúcuta, Norte de Santander, Colombia",
  correo: "reservasdiamondtravel@gmail.com",
  instagram: "@diamondtours_cucuta"
};

const ESTADOS = [
  { k: "borrador", l: "Borrador" },
  { k: "enviada", l: "Enviada" },
  { k: "aceptada", l: "Aceptada" },
  { k: "vencida", l: "Vencida" },
  { k: "cancelada", l: "Cancelada" }
];
const MONEDAS = {
  COP: { l: "Pesos colombianos (COP)", locale: "es-CO" },
  USD: { l: "Dólares estadounidenses (USD)", locale: "es-CO" },
  EUR: { l: "Euros (EUR)", locale: "es-CO" }
};

/* ---------- Helpers ---------- */
const s = v => (v == null ? "" : String(v)).trim();
const pad = n => String(n).padStart(2, "0");
function esNum(v) { return typeof v === "number" && isFinite(v); }
function fmtFecha(iso) {
  const m = s(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? m[3] + "/" + m[2] + "/" + m[1] : "";
}
function fechaValida(iso) {
  const m = s(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return false;
  const d = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
  return d.getUTCFullYear() === +m[1] && d.getUTCMonth() === +m[2] - 1 && d.getUTCDate() === +m[3];
}
function diasEntre(a, b) { // b - a, ISO dates
  if (!fechaValida(a) || !fechaValida(b)) return null;
  const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
  return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
}
function fmtMoneda(n, moneda) {
  if (!esNum(n)) return "";
  const m = MONEDAS[moneda] ? moneda : "COP";
  const neg = n < 0;
  const abs = new Intl.NumberFormat("es-CO", { style: "currency", currency: m, maximumFractionDigits: 0, minimumFractionDigits: 0 }).format(Math.abs(Math.round(n)));
  return (neg ? "- " : "") + abs.replace(/ /g, " ");
}
function fmtTel(t) {
  const d = s(t).replace(/\D/g, "");
  if (d.length === 10) return d.slice(0, 3) + " " + d.slice(3, 6) + " " + d.slice(6);
  return s(t);
}
function plural(n, uno, varios) { return n + " " + (n === 1 ? uno : varios); }
function codigo(numero) { return esNum(numero) ? "DT-" + String(numero).padStart(4, "0") : "Sin número"; }

function parseEdades(txt) {
  const t = s(txt);
  if (!t) return [];
  return t.split(/[,;\s]+|\by\b/i).map(x => x.trim()).filter(Boolean).map(x => (/^\d{1,2}$/.test(x) ? parseInt(x, 10) : NaN));
}
function enteroONulo(v) {
  if (v === "" || v == null) return null;
  const n = typeof v === "number" ? v : Number(v);
  return Number.isInteger(n) ? n : NaN;
}

/* ---------- Cálculos ---------- */
function calcular(q) {
  const v = (q && q.viaje) || {}, val = (q && q.valores) || {};
  const cats = [
    { k: "adultos", l: "Adultos", lu: "Adulto", cant: enteroONulo(v.adultos) || 0, unit: val.precioAdulto },
    { k: "ninos", l: "Niños", lu: "Niño", cant: enteroONulo(v.ninos) || 0, unit: val.precioNino },
    { k: "infantes", l: "Infantes", lu: "Infante", cant: enteroONulo(v.infantes) || 0, unit: val.precioInfante }
  ];
  const faltantes = [];
  const lineas = [];
  let subtotalPasajeros = 0;
  cats.forEach(c => {
    if (!(c.cant > 0)) return;
    const unitOk = esNum(c.unit) && c.unit >= 0;
    if (!unitOk) faltantes.push(c.k);
    const sub = unitOk ? c.cant * c.unit : null;
    if (unitOk) subtotalPasajeros += sub;
    lineas.push({ k: c.k, concepto: c.l, cant: c.cant, unit: unitOk ? c.unit : null, subtotal: sub });
  });
  const cargos = (val.cargos || []).filter(x => x && (s(x.concepto) || esNum(x.valor)));
  const descuentos = (val.descuentos || []).filter(x => x && (s(x.concepto) || esNum(x.valor)));
  const totalCargos = cargos.reduce((a, x) => a + (esNum(x.valor) ? x.valor : 0), 0);
  const totalDescuentos = descuentos.reduce((a, x) => a + (esNum(x.valor) ? x.valor : 0), 0);
  const pax = cats.reduce((a, c) => a + (c.cant > 0 ? c.cant : 0), 0);
  const total = subtotalPasajeros + totalCargos - totalDescuentos;
  const completo = faltantes.length === 0 && pax > 0;
  const anticipo = esNum(val.anticipo) ? val.anticipo : null;
  return {
    lineas, cargos, descuentos, faltantes, pax, completo,
    subtotalPasajeros, totalCargos, totalDescuentos, total,
    porPersona: pax > 0 && completo ? Math.round(total / pax) : null,
    anticipo,
    saldo: anticipo != null ? total - anticipo : null
  };
}

/* ---------- Validación ----------
   modo "borrador": exige lo mínimo para guardar sin datos inconsistentes.
   modo "pdf": además exige lo necesario para un documento completo. */
function validar(q, modo) {
  const errores = [], avisos = [];
  const add = (tab, campo, msg) => errores.push({ tab, campo, msg });
  const c = q.cliente || {}, v = q.viaje || {}, val = q.valores || {}, cond = q.condiciones || {};
  if (!s(c.nombre)) add("cliente", "c_nombre", "Escribe el nombre del cliente.");
  if (s(c.email) && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s(c.email))) add("cliente", "c_email", "Revisa el correo del cliente: debe tener el formato nombre@dominio.com.");
  if (!fechaValida(q.fechaElaboracion)) add("cliente", "q_fecha", "Indica la fecha de elaboración.");
  if (s(q.fechaVencimiento)) {
    if (!fechaValida(q.fechaVencimiento)) add("cliente", "q_venc", "La fecha de vigencia no es válida.");
    else if (diasEntre(q.fechaElaboracion, q.fechaVencimiento) < 0) add("cliente", "q_venc", "La vigencia no puede ser anterior a la fecha de elaboración.");
  }
  // Viaje
  if (s(v.fechaIda) && !fechaValida(v.fechaIda)) add("viaje", "v_ida", "La fecha de ida no es válida.");
  if (s(v.fechaRegreso) && !fechaValida(v.fechaRegreso)) add("viaje", "v_regreso", "La fecha de regreso no es válida.");
  if (fechaValida(v.fechaIda) && fechaValida(v.fechaRegreso) && diasEntre(v.fechaIda, v.fechaRegreso) < 0) add("viaje", "v_regreso", "La fecha de regreso no puede ser anterior a la de ida.");
  if (fechaValida(v.fechaIda) && fechaValida(q.fechaElaboracion) && diasEntre(q.fechaElaboracion, v.fechaIda) < 0) avisos.push("La fecha de ida es anterior a la fecha de elaboración.");
  const noches = enteroONulo(v.noches);
  if (Number.isNaN(noches) || (noches != null && (noches < 0 || noches > 365))) add("viaje", "v_noches", "El número de noches debe ser un número entero entre 0 y 365.");
  const cantidades = [["adultos", "v_adultos", "adultos"], ["ninos", "v_ninos", "niños"], ["infantes", "v_infantes", "infantes"]];
  cantidades.forEach(([k, campo, l]) => {
    const n = enteroONulo(v[k]);
    if (Number.isNaN(n) || (n != null && (n < 0 || n > 99))) add("viaje", campo, "El número de " + l + " debe ser un número entero entre 0 y 99.");
  });
  const ninos = enteroONulo(v.ninos) || 0, adultos = enteroONulo(v.adultos) || 0, infantes = enteroONulo(v.infantes) || 0;
  const edades = parseEdades(v.edadesNinos);
  if (edades.some(e => Number.isNaN(e) || e < 0 || e > 17)) add("viaje", "v_edades", "Escribe las edades de los niños como números separados por comas (por ejemplo: 5, 8).");
  else if (edades.length && edades.length !== ninos) add("viaje", "v_edades", "Escribiste " + plural(edades.length, "edad", "edades") + " pero hay " + plural(ninos, "niño", "niños") + ".");
  (v.tramos || []).forEach((t, i) => { if (s(t.fecha) && !fechaValida(t.fecha)) add("viaje", "tramo_" + i, "La fecha del trayecto " + (i + 1) + " no es válida."); });
  // Valores
  const montos = [["precioAdulto", "precio por adulto"], ["precioNino", "precio por niño"], ["precioInfante", "precio por infante"], ["anticipo", "anticipo"]];
  montos.forEach(([k, l]) => { if (val[k] != null && (!esNum(val[k]) || val[k] < 0)) add("valores", "p_" + k, "El " + l + " no es un valor válido."); });
  (val.cargos || []).forEach((x, i) => {
    if (esNum(x.valor) && !s(x.concepto)) add("valores", "cargo_" + i, "Escribe el concepto del cargo " + (i + 1) + ".");
    if (s(x.concepto) && !esNum(x.valor)) add("valores", "cargo_" + i, "Escribe el valor del cargo “" + s(x.concepto) + "”.");
  });
  (val.descuentos || []).forEach((x, i) => {
    if (esNum(x.valor) && !s(x.concepto)) add("valores", "desc_" + i, "Escribe el concepto del descuento " + (i + 1) + ".");
    if (s(x.concepto) && !esNum(x.valor)) add("valores", "desc_" + i, "Escribe el valor del descuento “" + s(x.concepto) + "”.");
  });
  if (s(cond.fechaLimitePago) && !fechaValida(cond.fechaLimitePago)) add("condiciones", "k_limite", "La fecha límite de pago no es válida.");
  const r = calcular(q);
  if (r.total < 0) add("valores", "desc_0", "Los descuentos superan el valor de la cotización.");
  if (r.anticipo != null && r.completo && r.anticipo > r.total) add("valores", "p_anticipo", "El anticipo no puede ser mayor que el valor total.");

  if (modo === "pdf") {
    if (!s(v.destinos)) add("viaje", "v_destinos", "Escribe el destino del viaje.");
    if (adultos + ninos + infantes === 0) add("viaje", "v_adultos", "Indica al menos un pasajero.");
    if (infantes > 0 && adultos === 0) add("viaje", "v_adultos", "Los infantes deben viajar con al menos un adulto.");
    if (ninos > 0 && !edades.length) add("viaje", "v_edades", "Escribe la edad de cada niño.");
    const nombres = { adultos: "por adulto", ninos: "por niño", infantes: "por infante" };
    r.faltantes.forEach(k => add("valores", "p_" + ({ adultos: "precioAdulto", ninos: "precioNino", infantes: "precioInfante" })[k], "Falta el precio " + nombres[k] + ". Escribe 0 si no tiene costo."));
    if (r.completo && r.total <= 0) add("valores", "p_precioAdulto", "El valor total debe ser mayor que cero.");
  }
  return { errores, avisos, ok: errores.length === 0 };
}

function textoPasajeros(v) {
  const a = enteroONulo(v.adultos) || 0, n = enteroONulo(v.ninos) || 0, i = enteroONulo(v.infantes) || 0;
  const partes = [];
  if (a) partes.push(plural(a, "adulto", "adultos"));
  if (n) {
    const ed = parseEdades(v.edadesNinos).filter(x => !Number.isNaN(x));
    let t = plural(n, "niño", "niños");
    if (ed.length) t += " (" + (ed.length === 1 ? ed[0] + (ed[0] === 1 ? " año" : " años") : ed.slice(0, -1).join(", ") + " y " + ed[ed.length - 1] + " años") + ")";
    partes.push(t);
  }
  if (i) partes.push(plural(i, "infante", "infantes"));
  return partes.join(" · ");
}

function slug(t) {
  return s(t).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 40);
}
function nombreArchivo(q) {
  const nom = slug((q.cliente || {}).nombre);
  return "Cotizacion-" + codigo(q.numero) + (nom ? "-" + nom : "") + ".pdf";
}

function mensajeWhatsApp(q) {
  const c = q.cliente || {}, v = q.viaje || {}, r = calcular(q);
  const nombre = s(c.nombre).split(/\s+/)[0] || "";
  const lineas = [];
  lineas.push("Hola" + (nombre ? " " + nombre : "") + ", te saluda " + (s(q.asesorNombre) ? s(q.asesorNombre) + " de " : "") + "Diamond Travel.");
  let l2 = "Te comparto la cotización " + codigo(q.numero);
  if (s(v.destinos)) l2 += " de tu viaje a " + s(v.destinos);
  if (fechaValida(v.fechaIda)) l2 += " (" + fmtFecha(v.fechaIda) + (fechaValida(v.fechaRegreso) ? " al " + fmtFecha(v.fechaRegreso) : "") + ")";
  lineas.push(l2 + ".");
  if (r.completo) lineas.push("Valor total: " + fmtMoneda(r.total, (q.valores || {}).moneda) + ".");
  if (fechaValida(q.fechaVencimiento)) lineas.push("Esta cotización está vigente hasta el " + fmtFecha(q.fechaVencimiento) + ".");
  lineas.push("Te adjunto el PDF con todos los detalles. Quedamos atentos a tus preguntas.");
  return lineas.join("\n");
}
function enlaceWhatsApp(tel, texto) {
  let d = s(tel).replace(/\D/g, "");
  if (!d) return null;
  if (d.length === 10 && d[0] === "3") d = "57" + d;
  return "https://wa.me/" + d + "?text=" + encodeURIComponent(texto);
}

/* ---------- PDF ---------- */
const MM = 72 / 25.4;
const C = {
  navy: [14, 31, 61], navy2: [24, 44, 85], gold: [184, 145, 58], goldInk: [134, 102, 31], goldSoft: [247, 241, 226],
  ink: [19, 33, 59], muted: [91, 104, 128], line: [220, 225, 235], zebra: [245, 246, 249], white: [255, 255, 255], onNavyMuted: [169, 180, 204]
};

async function generarPDF(q, opts) {
  const PDFLib = opts.PDFLib;
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const col = a => rgb(a[0] / 255, a[1] / 255, a[2] / 255);
  const doc = await PDFDocument.create();
  doc.setTitle("Cotización " + codigo(q.numero) + " — Diamond Travel");
  doc.setAuthor("Diamond Travel");
  doc.setSubject("Cotización de viaje" + (s((q.viaje || {}).destinos) ? " a " + s(q.viaje.destinos) : ""));
  doc.setCreator("Diamond Travel CRM");
  doc.setProducer("Diamond Travel CRM");
  const F = {
    reg: await doc.embedFont(StandardFonts.Helvetica),
    bold: await doc.embedFont(StandardFonts.HelveticaBold),
    ital: await doc.embedFont(StandardFonts.HelveticaOblique),
    disp: await doc.embedFont(StandardFonts.TimesRomanBold)
  };
  const charset = new Set(F.reg.getCharacterSet());
  const MAP = { "→": "-", "←": "-", "•": "•", " ": " ", " ": " ", " ": " ", "\t": "    " };
  function limpio(t) {
    let out = "";
    for (const ch of String(t == null ? "" : t).normalize("NFC")) {
      if (ch === "\n") { out += ch; continue; }
      const m = MAP[ch] != null ? MAP[ch] : ch;
      for (const c2 of m) out += charset.has(c2.codePointAt(0)) ? c2 : "";
    }
    return out;
  }
  const logo = opts.logoPng ? await doc.embedPng(opts.logoPng) : null;

  const W = 595.28, H = 841.89, ML = 16 * MM, MR = 16 * MM, CW = W - ML - MR;
  const FOOT = 52, TOP_CONT = 64;
  let page, y;

  const T = (txt, x, yy, o) => {
    const t = limpio(txt); if (!t) return;
    page.drawText(t, { x, y: H - yy, size: o.size, font: o.font || F.reg, color: col(o.color || C.ink) });
  };
  const width = (txt, font, size) => font.widthOfTextAtSize(limpio(txt), size);
  const TR = (txt, xRight, yy, o) => T(txt, xRight - width(txt, o.font || F.reg, o.size), yy, o);
  const spaced = (txt, x, yy, o) => { // letter-spaced label
    let cx = x; const sp = o.spacing || 1.2;
    for (const ch of limpio(txt)) { T(ch, cx, yy, o); cx += width(ch, o.font || F.reg, o.size) + sp; }
    return cx - x - sp;
  };
  const spacedW = (txt, font, size, sp) => { let w = 0; for (const ch of limpio(txt)) w += width(ch, font, size) + sp; return w - sp; };
  const rect = (x, yy, w, h, fill, stroke, sw) => page.drawRectangle({ x, y: H - yy - h, width: w, height: h, color: fill ? col(fill) : undefined, borderColor: stroke ? col(stroke) : undefined, borderWidth: stroke ? (sw || 0.6) : 0 });
  const line = (x1, y1, x2, y2, c, th) => page.drawLine({ start: { x: x1, y: H - y1 }, end: { x: x2, y: H - y2 }, thickness: th || 0.6, color: col(c) });

  function wrap(txt, font, size, maxW) {
    const out = [];
    limpio(txt).split("\n").forEach(par => {
      const words = par.split(/ +/);
      let cur = "";
      words.forEach(w0 => {
        let w = w0;
        while (width(w, font, size) > maxW) { // palabra más larga que la línea
          let cut = w.length;
          while (cut > 1 && width(w.slice(0, cut), font, size) > maxW) cut--;
          if (cur) { out.push(cur); cur = ""; }
          out.push(w.slice(0, cut)); w = w.slice(cut);
        }
        const cand = cur ? cur + " " + w : w;
        if (width(cand, font, size) <= maxW) cur = cand; else { if (cur) out.push(cur); cur = w; }
      });
      out.push(cur);
    });
    while (out.length && out[out.length - 1] === "") out.pop();
    return out;
  }

  function nuevaPagina(primera) {
    page = doc.addPage([W, H]);
    if (primera) {
      const BH = 128;
      rect(0, 0, W, BH, C.navy);
      rect(0, BH, W, 2.2, C.gold);
      if (logo) {
        const lh = 100, lw = lh * logo.width / logo.height;
        page.drawImage(logo, { x: ML - 4, y: H - 14 - lh, width: lw, height: lh });
      } else {
        T("DIAMOND TRAVEL", ML, 60, { size: 20, font: F.disp, color: C.white });
      }
      const xr = W - MR;
      const lab = "COTIZACIÓN DE VIAJE";
      spaced(lab, xr - spacedW(lab, F.bold, 8.5, 1.6), 40, { size: 8.5, font: F.bold, color: C.gold, spacing: 1.6 });
      TR(codigo(q.numero), xr, 70, { size: 26, font: F.disp, color: C.white });
      TR("Elaborada el " + (fmtFecha(q.fechaElaboracion) || "—"), xr, 90, { size: 9.5, color: C.onNavyMuted });
      if (fechaValida(q.fechaVencimiento)) TR("Válida hasta el " + fmtFecha(q.fechaVencimiento), xr, 104, { size: 9.5, font: F.bold, color: C.white });
      y = BH + 26;
    } else {
      rect(0, 0, W, 40, C.navy);
      rect(0, 40, W, 1.6, C.gold);
      T("DIAMOND TRAVEL", ML, 25, { size: 12, font: F.disp, color: C.white });
      TR("Cotización " + codigo(q.numero), W - MR, 25, { size: 9.5, font: F.bold, color: C.gold });
      y = TOP_CONT;
    }
  }
  function cabe(h) { return y + h <= H - FOOT - 10; }
  function asegurar(h) { if (!cabe(h)) nuevaPagina(false); }

  function tituloSeccion(t, minSiguiente) {

    const xs = []; let acc = ML; cols.forEach(c => { xs.push(acc); acc += c.w * CW; });

    filas.forEach((f, ri) => {

      const h = Math.max(...cells.map(cl => Math.max(cl.length, 1))) * lh + 10;

      cells.forEach((cl, i) => {
        const c = cols[i], cw = c.w * CW;

      page.drawLine({ start: { x: ML + 4, y: H - cy - 3.2 }, end: { x: ML + 9.5, y: H - cy + 3.5 }, thickness: 1.5, color: col(C.gold) });
    } else {

    ls.forEach(ln => { T(ln, ML + 18, y + 10, { size: 10, color: tipo === "si" ? C.ink : C.muted }); y += 14; });

  {
    const extra = [];

  if (conds.length) {
    tituloSeccion("Condiciones comerciales", 40);
    conds.forEach(([k, t]) => {
      asegurar(36);
      T(k, ML, y + 10, { size: 10, font: F.bold, color: C.navy }); y += 16;

  // Contacto (si no cabe en la última página, los datos siguen en el pie de cada página)
  {
    const h = 66;

  // Pies de página con numeración
  const pages = doc.getPages();

}

<script>
(function(){

];

/* ---------- Formatting ---------- */
const COP=new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0});
const fmtCOP=n=>(typeof n==="number"&&isFinite(n))?COP.format(n):"—";
const pad=n=>String(n).padStart(2,"0");
function fmtFecha(iso){ // "2026-12-20" -> 20/12/2026
  if(!iso||typeof iso!=="string")return "—";
  const m=iso.match(/^(\d{4})-(\d{2})-(\d{2})/); if(!m)return "—";
  return m[3]+"/"+m[2]+"/"+m[1];
}
function fmtFechaHora(ts){ // ISO timestamp -> local DD/MM/AAAA HH:MM
  const d=new Date(ts); if(isNaN(d))return "—";
  return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+" "+pad(d.getHours())+":"+pad(d.getMinutes());
}
function fmtFechaTs(ts){const d=new Date(ts);if(isNaN(d))return "—";return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();}
function hoyISO(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function diasHasta(iso){if(!iso)return null;const m=iso.match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return null;
  const t=new Date(+m[1],+m[2]-1,+m[3]);const h=new Date();h.setHours(0,0,0,0);return Math.round((t-h)/86400000);}

function waLink(tel){let d=String(tel||"").replace(/[^\d]/g,"");if(!d)return null;if(d.length===10&&d[0]==="3")d="57"+d;return "https://wa.me/"+d;}

};

/* ---------- Toast & overlay ---------- */
let toastTimer;

/* Capas superpuestas: cada ventana tiene una clave; abrir la misma clave la reemplaza en su lugar. */
const layers=[];

    const el=document.createElement("div");el.className="overlay";el.style.zIndex=String(50+layers.length*2);

    el.addEventListener("click",e=>{if(e.target===el&&!L.noBackdrop)closeOverlay(key);});
  }
  L.noBackdrop=!!(opts&&opts.noBackdrop);
  L.el.innerHTML='<div class="sheet '+(cls||"")+'" role="dialog" aria-modal="true">'+html+'</div>';
  document.body.style.overflow="hidden";

}
function closeOverlay(key){
  const i=key?layers.findIndex(l=>l.key===key):layers.length-1;

function confirmar(titulo,texto,accion,peligro,accion2){
  return new Promise(res=>{
    const s=openOverlay('<div class="sheet-head"><h2>'+esc(titulo)+'</h2></div><div class="sheet-body"><p style="margin:0;white-space:pre-line">'+esc(texto)+'</p><div class="sheet-foot"><button class="btn" id="cNo">Cancelar</button>'+(accion2?'<button class="btn" id="cAlt">'+esc(accion2)+'</button>':'')+'<button class="btn '+(peligro?"btn-danger":"btn-gold")+'" id="cSi">'+esc(accion)+'</button></div></div>',"confirm","confirm");
    s.querySelector("#cNo").onclick=()=>{closeOverlay("confirm");res(false);};
    s.querySelector("#cSi").onclick=()=>{closeOverlay("confirm");res(true);};
    const alt=s.querySelector("#cAlt"); if(alt)alt.onclick=()=>{closeOverlay("confirm");res("alt");};
  });
}

/* ---------- Errors ---------- */
function explicarError(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){S.readOnly=true;return "No tienes permiso para guardar cambios en este CRM. Pide al administrador acceso como colaborador.";}
  if(c==="quota_exceeded")return "Se llenó el espacio de la base de datos. Exporta un respaldo y elimina registros antiguos.";
  if(c==="resource_exhausted")return "Demasiadas acciones seguidas. Espera unos segundos e intenta de nuevo.";
  if(c==="revoked"){S.readOnly=true;return "Tu acceso a este CRM cambió. Vuelve a abrir el enlace.";}
  return "No se pudo guardar por un problema de conexión. Intenta de nuevo.";
}
async function guardar(fn){
  if(!S.db){toast("Abre el CRM desde su enlace en Claude para guardar.");return false;}
  if(S.readOnly){toast("Modo solo lectura: no puedes guardar cambios.");return false;}
  try{await fn();return true;}
  catch(e){
    if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await fn();return true;}catch(e2){toast(explicarError(e2));render();return false;}}
    toast(explicarError(e));render();return false;
  }
}

/* ---------- People ---------- */
async function resolverPerfiles(){
  if(!S.user)return;
  const ids=new Set();S.clientes.forEach(c=>{if(c.asesorId)ids.add(c.asesorId);if(c.creadoPor)ids.add(c.creadoPor);(c.historial||[]).forEach(h=>h.autor&&ids.add(h.autor));});
  if(S.meId)ids.add(S.meId);
  if(!ids.size)return;
  try{S.profiles=await S.user.profiles([...ids]);}catch(_){}
}

function mesClave(ts){const d=new Date(ts);if(isNaN(d))return "";return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function viewInicio(){
  const cs=S.clientes, now=new Date();
  const mesKey=now.getFullYear()+"-"+pad(now.getMonth()+1);
  const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const nuevosMes=cs.filter(c=>mesClave(c.creadoEn)===mesKey).length;
  const activos=cs.filter(c=>ACTIVAS.includes(c.etapa));
  const potencial=activos.reduce((a,c)=>a+(c.presupuesto||0),0);
  const ganadosMes=cs.filter(c=>c.etapa==="ganado"&&mesClave(c.cerradoEn)===mesKey).length;
  const proximos=cs
    .filter(c=>c.etapa!=="perdido"&&c.fechaViaje)
    .map(c=>({c:c,d:diasHasta(c.fechaViaje)}))

    .sort((a,b)=>a.d-b.d).slice(0,6);
  const sinSeg=activos
    .map(c=>({c:c,d:diasDesde(c.ultimoContacto||c.creadoEn)}))
    .filter(x=>x.d!==null&&x.d>=7)
    .sort((a,b)=>b.d-a.d).slice(0,6);
  const conteo=ETAPAS.map(e=>({e:e,n:cs.filter(c=>c.etapa===e.k).length}));
  const maxN=Math.max(1,...conteo.map(x=>x.n));

  let h='<div class="page-head"><div><span class="eyebrow">Resumen de '+MESES[now.getMonth()]+' '+now.getFullYear()+'</span><h1>Buen día, equipo Diamond</h1></div>'+
    (S.readOnly||S.dbMissing?'':'<button class="btn btn-gold" data-act="nuevo">'+icon('<path d="M12 5v14M5 12h14"/>',18)+'Nuevo cliente</button>')+'</div>';
  h+=bannerEstado();

  const pend=S.cotizaciones.filter(q=>q.estado==="enviada");
  const valorPend=pend.reduce((a,q)=>{const r=DTCot.calcular(q);return a+((q.valores||{}).moneda==="COP"||!(q.valores||{}).moneda?(r.completo?r.total:0):0);},0);
  h+='<div class="kpis">'+
    '<div class="kpi lead"><span class="k">Presupuesto en proceso</span><span class="v money">'+fmtCOP(potencial)+'</span><span class="k">'+activos.length+' clientes activos de '+cs.length+'</span></div>'+
    '<div class="kpi"><span class="k">Clientes nuevos este mes</span><span class="v">'+nuevosMes+'</span></div>'+
    '<div class="kpi clickable" data-view-go="cotizaciones"><span class="k">Cotizaciones por responder</span><span class="v">'+pend.length+'</span><span class="k num">'+(valorPend?fmtCOP(valorPend):"Enviadas, sin respuesta")+'</span></div>'+
    '<div class="kpi"><span class="k">Ventas cerradas este mes</span><span class="v">'+ganadosMes+'</span></div></div>';

  h+='<div class="cols">';
  h+='<div class="panel panel-pad"><div class="section-title"><h2>Necesitan seguimiento</h2><span class="help">7 días o más sin contacto</span></div><div class="list">'+
    (sinSeg.length?sinSeg.map(x=>'<div class="row clickable" data-open="'+esc(x.c.id)+'"><div class="row-main"><span class="row-title">'+esc(x.c.nombre)+'</span><span class="row-sub">'+esc(etapaLabel(x.c.etapa))+' · '+esc(x.c.destinos||"Destino por definir")+'</span></div><span class="pill st-negociacion num">'+x.d+' días</span></div>').join("")
    :'<p class="muted" style="margin:6px 0">Todos los clientes activos tienen contacto reciente.</p>')+'</div></div>';

  h+='<div class="panel panel-pad"><div class="section-title"><h2>Embudo comercial</h2><button class="btn btn-ghost btn-sm" data-view-go="embudo">Ver tablero</button></div>'+
    conteo.map(x=>'<div class="funnel-row"><span>'+esc(x.e.l)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(x.n/maxN*100)+'%"></div></div><span class="num" style="text-align:right;font-weight:600">'+x.n+'</span></div>').join("")+'</div>';
  h+='</div>';

  h+='<div class="panel panel-pad"><div class="section-title"><h2>Viajes en los próximos 60 días</h2></div><div class="list">'+

  h+='<p class="help">Las reservas y los pagos por cobrar se sumarán aquí cuando construyamos esos módulos.</p>';
  return h;

function filtrar(){
  const q=S.q.trim().toLowerCase();
  return S.clientes.filter(c=>{
    if(S.etapa!=="todas"&&c.etapa!==S.etapa)return false;
    if(S.mine&&c.asesorId!==S.meId)return false;
    if(!q)return true;
    return [c.nombre,c.telefono,c.email,c.destinos,c.ciudad].some(v=>String(v||"").toLowerCase().includes(q));
  }).sort((a,b)=>String(b.actualizadoEn||"").localeCompare(String(a.actualizadoEn||"")));
}

      '<div class="contact-line"><span class="muted" style="width:72px">Ciudad</span><span>'+esc(c.ciudad||"—")+'</span></div>'+
      '<div class="contact-line"><span class="muted" style="width:72px">Origen</span><span>'+esc(c.origen||"—")+'</span></div></div>'+

async function cambiarEtapa(id,nueva){
  const c=S.clientes.find(x=>x.id===id); if(!c||c.etapa===nueva)return;
  const ahora=new Date().toISOString();
  const hist=(c.historial||[]).slice();
  hist.push({fecha:ahora,tipo:"Etapa",texto:"Cambió de “"+etapaLabel(c.etapa)+"” a “"+etapaLabel(nueva)+"”.",autor:S.meId});
  const patch={etapa:nueva,historial:hist,actualizadoEn:ahora};
  if(nueva==="ganado")patch.cerradoEn=ahora;
  if(await guardar(()=>S.db.doc("clientes/"+id).update(patch)))toast(c.nombre+" → "+etapaLabel(nueva));
}

async function borrarDemo(){
  const demos=S.clientes.filter(c=>c.ejemplo);
  const ids=new Set(demos.map(c=>c.id));
  const dq=S.cotizaciones.filter(q=>q.ejemplo||ids.has(q.clienteId));
  if(!demos.length&&!dq.length)return;
  if(!(await confirmar("¿Eliminar datos de prueba?","Se borrarán "+demos.length+" clientes marcados como PRUEBA"+(dq.length?" y "+dq.length+" cotizaciones asociadas a ellos":"")+". Tus clientes reales no se tocan.","Eliminar",true)))return;
  for(const q of dq){if(!(await guardar(()=>S.db.doc("cotizaciones/"+q.id).delete())))return;}
  for(const c of demos){if(!(await guardar(()=>S.db.doc("clientes/"+c.id).delete())))return;}
  toast("Datos de prueba eliminados");
}

const TAB_ID="t"+Math.random().toString(36).slice(2,10);
const estadoLabel=k=>(D.ESTADOS.find(e=>e.k===k)||{l:k}).l;
const monedaDe=q=>((q.valores||{}).moneda)||"COP";
const ICON_PLUS='<path d="M12 5v14M5 12h14"/>';
const ICON_X='<path d="M6 6l12 12M18 6 6 18"/>';
function totalTxt(q){const r=D.calcular(q);return r.completo?D.fmtMoneda(r.total,monedaDe(q)):"Por definir";}
function vencida(q){return (q.estado==="borrador"||q.estado==="enviada")&&D.fechaValida(q.fechaVencimiento)&&q.fechaVencimiento<hoyISO();}
const clone=o=>JSON.parse(JSON.stringify(o==null?null:o));

/* ----- Lista ----- */
function filtrarCot(){
  const t=S.cq.trim().toLowerCase();
  return S.cotizaciones.filter(q=>{
    if(S.cestado!=="todas"&&q.estado!==S.cestado)return false;
    if(!t)return true;
    const c=q.cliente||{},v=q.viaje||{};
    return [D.codigo(q.numero),c.nombre,c.telefono,c.email,v.destinos].some(x=>String(x||"").toLowerCase().includes(t));
  }).sort((a,b)=>(b.numero||0)-(a.numero||0));
}
function cotCardHTML(q){
  const v=q.viaje||{};
  return '<div class="q-card" data-cot="'+esc(q.id)+'">'+
    '<div style="min-width:0;display:flex;flex-direction:column;gap:2px"><span class="q-code">'+esc(D.codigo(q.numero))+'</span><span style="font-weight:600;font-size:15.5px;overflow-wrap:anywhere">'+esc((q.cliente||{}).nombre||"Sin cliente")+(q.ejemplo?' <span class="tag-demo">Prueba</span>':'')+'</span></div>'+
    '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="pill est-'+esc(q.estado)+'">'+esc(estadoLabel(q.estado))+'</span><span class="q-total">'+esc(totalTxt(q))+'</span></div>'+
    '<div class="q-meta"><span>'+esc(v.destinos||"Destino por definir")+'</span>'+(D.fechaValida(v.fechaIda)?'<span>Viaje '+D.fmtFecha(v.fechaIda)+'</span>':'')+'<span>Elaborada '+(D.fmtFecha(q.fechaElaboracion)||"—")+'</span>'+
    (vencida(q)?'<span class="flag">Vigencia vencida el '+D.fmtFecha(q.fechaVencimiento)+'</span>':(D.fechaValida(q.fechaVencimiento)?'<span>Válida hasta '+D.fmtFecha(q.fechaVencimiento)+'</span>':''))+'</div></div>';
}
function listaCotHTML(){const l=filtrarCot();return l.length?l.map(cotCardHTML).join(""):'<div class="empty"><p class="muted">Ninguna cotización coincide con la búsqueda.</p></div>';}
function viewCotizaciones(){
  let h='<div class="page-head"><div><span class="eyebrow">Generador de cotizaciones</span><h1>Cotizaciones</h1></div>'+
    (S.readOnly||S.dbMissing?'':'<button class="btn btn-gold" data-act="nueva-cot">'+icon(ICON_PLUS,18)+'Nueva cotización</button>')+'</div>';
  h+=bannerEstado();
  if(!S.cotReady&&!S.dbMissing)return h+'<div class="panel empty"><p class="muted">Cargando cotizaciones…</p></div>';
  if(!S.cotizaciones.length)return h+'<div class="panel empty"><h2 style="font-family:var(--f-display);font-size:22px">Aún no hay cotizaciones</h2>'+
    '<p class="muted">Llena el formulario con los datos del viaje: el CRM calcula los valores, asigna el número consecutivo y genera el PDF con el logo y los datos de contacto de Diamond Travel.</p>'+
    (S.readOnly||S.dbMissing?'':'<button class="btn btn-gold" data-act="nueva-cot">Crear la primera cotización</button>')+'</div>';
  const cuenta=k=>S.cotizaciones.filter(q=>q.estado===k).length;
  h+='<div class="toolbar"><input class="input search" id="qq" type="search" placeholder="Buscar por número, cliente, teléfono o destino" value="'+esc(S.cq)+'" aria-label="Buscar cotizaciones">'+
    '<select class="input" id="qe" style="width:auto;flex:0 1 220px" aria-label="Filtrar por estado"><option value="todas">Todos los estados ('+S.cotizaciones.length+')</option>'+
    D.ESTADOS.map(e=>'<option value="'+e.k+'"'+(S.cestado===e.k?" selected":"")+'>'+e.l+' ('+cuenta(e.k)+')</option>').join("")+'</select></div>';
  h+='<div class="panel" id="cotList">'+listaCotHTML()+'</div>';
  return h;
}
function panelCotCliente(c,puede){
  const qs=S.cotizaciones.filter(q=>q.clienteId===c.id).sort((a,b)=>(b.numero||0)-(a.numero||0));
  return '<div class="panel panel-pad" style="display:flex;flex-direction:column;gap:8px"><div class="section-title"><h2>Cotizaciones</h2>'+(puede?'<button class="btn btn-sm" id="dNuevaCot">'+icon(ICON_PLUS,16)+'Nueva cotización</button>':'')+'</div>'+
    (qs.length?'<div class="list">'+qs.map(q=>'<div class="row clickable" data-cot="'+esc(q.id)+'"><div class="row-main"><span class="row-title">'+esc(D.codigo(q.numero))+' · '+esc((q.viaje||{}).destinos||"Destino por definir")+'</span><span class="row-sub">Elaborada '+(D.fmtFecha(q.fechaElaboracion)||"—")+' · '+esc(totalTxt(q))+'</span></div><span class="pill est-'+esc(q.estado)+'">'+esc(estadoLabel(q.estado))+'</span></div>').join("")+'</div>'
      :'<p class="muted" style="margin:0">Este cliente aún no tiene cotizaciones.</p>')+'</div>';
}

/* ----- Ficha de la cotización ----- */
let cotId=null;
function abrirCotizacion(id){cotId=id;pintarCotizacion();}
function pintarCotizacion(){
  const q=S.cotizaciones.find(x=>x.id===cotId);
  if(!q){if(cotId){closeOverlay("cot");cotId=null;}return;}
  const puede=!S.readOnly&&!S.dbMissing;
  const v=q.viaje||{},c=q.cliente||{},val=q.valores||{},r=D.calcular(q),mon=monedaDe(q);
  const chk=D.validar(q,"pdf");
  const wa=c.telefono?D.enlaceWhatsApp(c.telefono,D.mensajeWhatsApp(q)):null;
  const fechas=D.fechaValida(v.fechaIda)?D.fmtFecha(v.fechaIda)+(D.fechaValida(v.fechaRegreso)?" – "+D.fmtFecha(v.fechaRegreso):""):"Por definir";
  const cliExiste=q.clienteId&&S.clientes.some(x=>x.id===q.clienteId);
  const hist=(q.historialEstados||[]).slice().sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const kv=(k,x)=>x?'<dt>'+esc(k)+'</dt><dd>'+esc(x)+'</dd>':'';
  const s=openOverlay(
    '<div class="sheet-head"><span class="eyebrow">Cotización</span><button class="btn btn-ghost btn-sm" id="qClose">Cerrar</button></div>'+
    '<div class="sheet-body">'+
    '<div class="pass"><div class="pass-main"><div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span class="pill est-'+esc(q.estado)+'">'+esc(estadoLabel(q.estado))+'</span>'+(vencida(q)?'<span class="pill est-vencida">Vigencia vencida</span>':'')+(q.ejemplo?'<span class="tag-demo">Prueba</span>':'')+'</div>'+
      '<div class="pass-name">'+esc(D.codigo(q.numero))+'</div>'+
      '<div class="pass-grid"><div><div class="k">Cliente</div><div class="v">'+esc(c.nombre||"—")+'</div></div><div><div class="k">Destino</div><div class="v">'+esc(v.destinos||"Por definir")+'</div></div>'+
      '<div><div class="k">Fechas</div><div class="v num">'+esc(fechas)+'</div></div><div><div class="k">Pasajeros</div><div class="v">'+esc(D.textoPasajeros(v)||"—")+'</div></div></div></div>'+
      '<div class="pass-stub"><div><div class="brand-sub">Valor total</div><div class="budget">'+esc(r.completo?D.fmtMoneda(r.total,mon):"Por definir")+'</div></div><div style="font-size:12.5px;color:var(--on-navy-muted)">'+(D.fechaValida(q.fechaVencimiento)?"Válida hasta "+D.fmtFecha(q.fechaVencimiento):"Sin fecha de vigencia")+'</div></div></div>'+
    (chk.ok?'':'<div class="errbox"><b>Para generar el PDF falta completar:</b><ul>'+chk.errores.map(e=>'<li>'+esc(e.msg)+'</li>').join("")+'</ul></div>')+
    '<div class="panel panel-pad" style="display:flex;flex-direction:column;gap:12px"><h2>Documento PDF</h2>'+
      '<div class="actions"><button class="btn btn-gold" id="qGen"'+(chk.ok?'':' disabled')+'>Generar PDF</button><button class="btn" id="qDown"'+(chk.ok?'':' disabled')+'>Descargar PDF</button></div>'+
      '<p class="help" style="margin:0">El PDF se arma con los datos guardados de esta cotización. En el iPad, al descargarlo se abre el menú de compartir: puedes guardarlo en Archivos o enviarlo directo por WhatsApp o correo.</p></div>'+
    '<div class="panel panel-pad" style="display:flex;flex-direction:column;gap:12px"><h2>Enviar por WhatsApp</h2>'+
      (wa?'<div class="actions"><a class="btn" id="qWa" href="'+esc(wa)+'" target="_blank" rel="noopener">Abrir WhatsApp con el mensaje</a><button class="btn" id="qCopy">Copiar mensaje</button>'+(puede&&q.estado==="borrador"?'<button class="btn" id="qMarkSent">Marcar como enviada</button>':'')+'</div>'+
        '<p class="help" style="margin:0;white-space:pre-line">'+esc(D.mensajeWhatsApp(q))+'</p><p class="help" style="margin:0">WhatsApp no permite adjuntar archivos desde un enlace: después de abrir la conversación, adjunta el PDF descargado.</p>'
        :'<p class="muted" style="margin:0">Esta cotización no tiene un número de WhatsApp del cliente.</p>')+'</div>'+
    '<div class="panel panel-pad" style="display:flex;flex-direction:column;gap:12px"><div class="section-title"><h2>Estado</h2></div>'+
      (puede?'<select class="input" id="qEstado" aria-label="Cambiar estado">'+D.ESTADOS.map(e=>'<option value="'+e.k+'"'+(e.k===q.estado?" selected":"")+'>'+e.l+'</option>').join("")+'</select>':'')+
      (hist.length?'<div class="timeline">'+hist.map(x=>'<div class="tl-item"><span class="tl-dot"></span><div class="tl-body"><span class="tl-meta">'+fmtFechaHora(x.fecha)+' · '+esc(nombrePersona(x.autor))+'</span><span class="tl-text">'+esc(estadoLabel(x.estado))+'</span></div></div>').join("")+'</div>':'')+'</div>'+
    '<div class="panel panel-pad" style="display:flex;flex-direction:column;gap:12px"><div class="section-title"><h2>Resumen</h2>'+(cliExiste?'<button class="btn btn-sm" id="qCli">Ver cliente</button>':'')+'</div><dl class="kv">'+
      kv("Teléfono",D.fmtTel(c.telefono))+kv("Correo",c.email)+kv("Asesor(a)",q.asesorNombre)+kv("Elaborada",D.fmtFecha(q.fechaElaboracion))+kv("Salida desde",v.ciudadSalida)+
      kv("Noches",v.noches!=null?String(v.noches):"")+kv("Aerolínea",v.aerolinea)+kv("Hotel",[v.hotel,v.categoriaHotel].filter(Boolean).join(" · "))+kv("Alimentación",v.regimen)+
      kv("Servicios incluidos",(q.servicios||[]).filter(x=>x.incluido!==false&&x.descripcion).length?String((q.servicios||[]).filter(x=>x.incluido!==false&&x.descripcion).length):"")+

async function cambiarEstadoCot(q,nuevo){
  if(q.estado===nuevo)return;
  const ahora=new Date().toISOString();
  const cl=q.clienteId?S.clientes.find(x=>x.id===q.clienteId):null;
  let marcarGanado=false;
  if(nuevo==="aceptada"&&cl&&cl.etapa!=="ganado"){
    const ans=await confirmar("Cotización aceptada","¿Quieres pasar también a "+cl.nombre+" a la etapa “Venta cerrada” del embudo?","Sí, venta cerrada",false,"Solo la cotización");
    if(ans===false){pintarCotizacion();return;}
    marcarGanado=ans===true;
  }
  const hist=(q.historialEstados||[]).slice();hist.push({estado:nuevo,fecha:ahora,autor:S.meId});
  if(!(await guardar(()=>S.db.doc("cotizaciones/"+q.id).update({estado:nuevo,historialEstados:hist,actualizadoEn:ahora})))){pintarCotizacion();return;}
  if(cl){
    const ch=(cl.historial||[]).slice(),patch={actualizadoEn:ahora};
    ch.push({fecha:ahora,tipo:"Cotización",texto:"Cotización "+D.codigo(q.numero)+" marcada como “"+estadoLabel(nuevo)+"”.",autor:S.meId});
    if(nuevo==="enviada"){patch.ultimoContacto=ahora;if(cl.etapa==="nuevo"||cl.etapa==="contactado"){ch.push({fecha:ahora,tipo:"Etapa",texto:"Cambió de “"+etapaLabel(cl.etapa)+"” a “"+etapaLabel("cotizado")+"”.",autor:S.meId});patch.etapa="cotizado";}}
    if(marcarGanado){ch.push({fecha:ahora,tipo:"Etapa",texto:"Cambió de “"+etapaLabel(cl.etapa)+"” a “"+etapaLabel("ganado")+"”.",autor:S.meId});patch.etapa="ganado";patch.cerradoEn=ahora;}
    patch.historial=ch;
    await guardar(()=>S.db.doc("clientes/"+cl.id).update(patch));
  }
  toast("Estado actualizado: "+estadoLabel(nuevo));
}

/* ----- PDF: carga de librerías, generación, vista previa y descarga ----- */
let pdfLibP=null,pdfjsP=null,logoBytes=null;
function cargarScript(urls){
  return new Promise((res,rej)=>{let i=0;const next=()=>{if(i>=urls.length)return rej(new Error("no_lib"));const sc=document.createElement("script");sc.src=urls[i++];sc.onload=()=>res();sc.onerror=()=>{sc.remove();next();};document.head.appendChild(sc);};next();});
}
function cargarPdfLib(){
  if(window.PDFLib)return Promise.resolve(window.PDFLib);
  if(!pdfLibP)pdfLibP=cargarScript([
    "https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js",
    "https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js",
    "https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"
  ]).then(()=>{if(!window.PDFLib)throw new Error("no_lib");return window.PDFLib;}).catch(e=>{pdfLibP=null;throw e;});
  return pdfLibP;
}
function cargarPdfJs(){
  if(!pdfjsP){
    const base="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/legacy/build/";
    pdfjsP=(async()=>{
      const lib=await import(base+"pdf.min.mjs");
      if(!globalThis.pdfjsWorker)globalThis.pdfjsWorker=await import(base+"pdf.worker.min.mjs");
      lib.GlobalWorkerOptions.workerSrc=base+"pdf.worker.min.mjs";
      return lib;
    })().catch(e=>{pdfjsP=null;throw e;});
  }
  return pdfjsP;
}
function logoPng(){
  if(!logoBytes){const bin=atob(LOGO_B64);logoBytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)logoBytes[i]=bin.charCodeAt(i);}
  return logoBytes;
}
async function construirPDF(q){const PDFLib=await cargarPdfLib();return await D.generarPDF(q,{PDFLib:PDFLib,logoPng:logoPng()});}
async function renderPaginas(bytes,cont){
  const lib=await cargarPdfJs();
  const pdf=await lib.getDocument({data:bytes.slice(0)}).promise;
  const w=Math.max(280,Math.min((cont.clientWidth||640)-28,640));
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const frag=[];
  for(let n=1;n<=pdf.numPages;n++){
    const p=await pdf.getPage(n);
    const vp=p.getViewport({scale:w/p.getViewport({scale:1}).width*dpr});
    const cv=document.createElement("canvas");cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
    cv.setAttribute("role","img");cv.setAttribute("aria-label","Página "+n+" de "+pdf.numPages);
    await p.render({canvasContext:cv.getContext("2d"),canvas:cv,viewport:vp}).promise;
    frag.push(cv);
  }
  cont.innerHTML="";frag.forEach(cv=>cont.appendChild(cv));
  return pdf.numPages;
}
const kb=n=>Math.max(1,Math.round(n/1024))+" KB";
async function abrirVistaPrevia(q,opts){
  const guardada=!!(opts&&opts.guardada);
  const chk=D.validar(q,"pdf");
  const tel=(q.cliente||{}).telefono;
  const s=openOverlay(
    '<div class="sheet-head"><h2>'+(guardada?"PDF de la cotización ":"Vista previa ")+esc(q.numero?D.codigo(q.numero):"(sin guardar)")+'</h2><button class="btn btn-ghost btn-sm" id="pvClose">Cerrar</button></div>'+
    '<div class="sheet-body">'+
    (guardada?'':'<div class="banner info">Vista previa con los datos actuales del formulario. Para descargar el PDF, guarda primero la cotización.</div>')+
    (chk.ok?'':'<div class="errbox"><b>El documento aún no está completo:</b><ul>'+chk.errores.map(e=>'<li>'+esc(e.msg)+'</li>').join("")+'</ul></div>')+
    '<p class="help" id="pvStatus" style="margin:0" role="status">Generando el PDF…</p>'+
    (guardada?'<div class="actions" id="pvActs" hidden><button class="btn btn-gold" id="pvDown">Descargar PDF</button>'+(tel?'<a class="btn" href="'+esc(D.enlaceWhatsApp(tel,D.mensajeWhatsApp(q)))+'" target="_blank" rel="noopener">Abrir WhatsApp con el mensaje</a>':'')+'</div>':'')+
    '<div class="pv-pages" id="pvPages"><p class="muted" style="margin:24px 0">Preparando las páginas…</p></div>'+
    '</div>',"wide","preview");
  s.querySelector("#pvClose").onclick=()=>closeOverlay("preview");
  const st=s.querySelector("#pvStatus");
  let bytes;
  try{bytes=await construirPDF(q);}
  catch(e){console.error(e);st.textContent="No se pudo cargar el generador de PDF. Revisa tu conexión a internet e intenta de nuevo.";st.className="err";s.querySelector("#pvPages").innerHTML="";return;}
  if(!hayCapa("preview"))return;
  const acts=s.querySelector("#pvActs");
  if(acts){acts.hidden=false;const b=s.querySelector("#pvDown");b.onclick=()=>descargarPDF(q,bytes,b);}
  try{
    const n=await renderPaginas(bytes,s.querySelector("#pvPages"));
    st.textContent="PDF generado: "+n+(n===1?" página":" páginas")+" · "+kb(bytes.length)+(guardada?" · "+D.nombreArchivo(q):"");
  }catch(e){
    console.error(e);
    st.textContent="El PDF se generó ("+kb(bytes.length)+"), pero la vista previa no se pudo mostrar en este dispositivo."+(guardada?" Descárgalo para revisarlo.":"");
    s.querySelector("#pvPages").innerHTML="";
  }
}
async function descargarPDF(q,bytes,btn){
  if(!S.downloads){toast("Las descargas no están disponibles en esta vista. Abre el CRM desde su enlace en Claude.");return;}
  const chk=D.validar(q,"pdf"); if(!chk.ok){toast("Completa la cotización antes de descargar el PDF.");return;}
  const txt=btn?btn.textContent:"";
  if(btn){btn.disabled=true;btn.textContent="Preparando…";}
  try{
    if(!bytes)bytes=await construirPDF(q);
    await S.downloads.save({filename:D.nombreArchivo(q),data:new Blob([bytes],{type:"application/pdf"})});
    toast("PDF listo: elige dónde guardarlo o compartirlo");
  }catch(e){
    if(e&&e.code==="declined"){}
    else if(e&&e.code==="rate_limited")toast("Ya hay una descarga en curso.");
    else if(e&&e.message==="no_lib")toast("No se pudo cargar el generador de PDF. Revisa tu conexión.");
    else{console.error(e);toast("No se pudo preparar el PDF.");}
  }finally{if(btn){btn.disabled=false;btn.textContent=txt;}}
}

/* ----- Consecutivo ----- */
async function siguienteNumero(){
  const ref=S.db.doc("config/consecutivo");
  const maxLocal=S.cotizaciones.reduce((m,q)=>Math.max(m,Number.isInteger(q.numero)?q.numero:0),0);
  if(typeof ref.acquire!=="function")return maxLocal+1;
  for(let i=0;i<16;i++){
    const res=await ref.acquire({holder:TAB_ID,ttlMs:2500});
    if(res&&res.acquired){
      const snap=await ref.get();
      const prev=snap.exists&&Number.isInteger((snap.data()||{}).ultimo)?snap.data().ultimo:0;
      const n=Math.max(prev,maxLocal)+1;
      await ref.set({ultimo:n,actualizadoEn:new Date().toISOString()});
      return n;
    }
    await new Promise(r=>setTimeout(r,300+Math.random()*500));
  }
  throw {code:"resource_exhausted"};
}

  });

function calcHTML(){
  const r=D.calcular(E),mon=E.valores.moneda,f=n=>D.fmtMoneda(n,mon);
  let h='<div class="calc">';
  if(!r.pax)h+='<div class="calc-row"><span class="muted">Indica los pasajeros en la pestaña Viaje.</span></div>';
  r.lineas.forEach(l=>{h+='<div class="calc-row"><span>'+esc(l.concepto)+' ('+l.cant+')</span><b>'+(l.subtotal!=null?f(l.subtotal):'<span class="err">Falta el precio</span>')+'</b></div>';});
  if(r.totalCargos)h+='<div class="calc-row"><span>Otros cargos</span><b>'+f(r.totalCargos)+'</b></div>';
  if(r.totalDescuentos)h+='<div class="calc-row"><span>Descuentos</span><b>'+f(-r.totalDescuentos)+'</b></div>';
  h+='<div class="calc-total"><span>Valor total</span><b>'+(r.completo?f(r.total):"Por definir")+'</b></div>';
  if(r.completo&&r.pax>1)h+='<div class="calc-row"><span>Promedio por pasajero ('+r.pax+')</span><b>'+f(r.porPersona)+'</b></div>';
  if(r.anticipo!=null)h+='<div class="calc-row"><span>Anticipo requerido</span><b>'+f(r.anticipo)+'</b></div>';
  if(r.anticipo!=null&&r.completo)h+='<div class="calc-row"><span>Saldo pendiente</span><b>'+f(r.saldo)+'</b></div>';
  return h+'</div>';
}

function edInput(ev){

  const path=el.dataset&&el.dataset.k;if(!path)return;
  const t=el.dataset.t;let v;
  if(t==="money"){const d=el.value.replace(/[^\d]/g,"");v=d?parseInt(d,10):null;if(ev.type==="input"){const nv=montoTxt(v);if(el.value!==nv)el.value=nv;}}
  else if(t==="int"){v=el.value===""?null:Number(el.value);}
  else if(t==="bool"){v=el.checked;}
  else v=el.value;
  setP(E,path,v);
  el.classList.remove("bad");
  if(t==="date"){const h=el.closest(".field")&&el.closest(".field").querySelector("[data-fecha-de]");if(h)h.textContent=v?D.fmtFecha(v):"DD/MM/AAAA";}
  if(path==="viaje.noches")edNochesManual=v!=null;
  if((path==="viaje.fechaIda"||path==="viaje.fechaRegreso")&&!edNochesManual){
    const n=D.diasEntre(E.viaje.fechaIda,E.viaje.fechaRegreso);
    if(n!=null&&n>=0){E.viaje.noches=n;const ni=document.getElementById("e_viaje_noches");if(ni)ni.value=n;}
  }
  if(path.startsWith("cliente.")){const dh=document.getElementById("dupHint");if(dh)dh.innerHTML=dupHintHTML();}
  if(path==="valores.moneda"&&ev.type==="change"){pintarEditor();return;}
  actualizarCalc();

  }

  if(a==="add-tramo"){E.viaje.tramos.push({fecha:"",ruta:"",vuelo:"",salida:"",llegada:""});pintarEditor();return;}
  if(a==="add-serv"){E.servicios.push({descripcion:"",incluido:true});pintarEditor();const ins=document.querySelectorAll('#overlayRoot [data-k^="servicios."]');if(ins.length)ins[ins.length-1].focus();return;}

  if(a==="tog-serv"){const x=E.servicios[+b.dataset.i];x.incluido=x.incluido===false;b.setAttribute("aria-pressed",String(x.incluido));b.textContent=x.incluido?"Incluido":"No incluido";return;}
  if(a==="add-cargo"){E.valores.cargos.push({concepto:"",valor:null});pintarEditor();return;}
  if(a==="add-desc"){E.valores.descuentos.push({concepto:"",valor:null});pintarEditor();return;}
  if(a==="del"){const l=getP(E,b.dataset.list);l.splice(+b.dataset.i,1);edErrores=[];pintarEditor();return;}
  if(a==="cond-cargar"){await cargarCondiciones();return;}
