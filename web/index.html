<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diamond Travel CRM</title>
<meta name="description" content="CRM de la agencia de viajes Diamond Travel, Cúcuta.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E1F3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diamond CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="authRoot" class="auth"><img class="auth-logo" src="assets/logo.png" alt="Diamond Travel" width="180" height="146"><p class="auth-foot" role="status">Cargando…</p></div>
<div class="app" id="appRoot" hidden>
  <aside class="rail" aria-label="Menú principal">
    <div class="brand">
      <img class="logo-rail" src="assets/logo.png" alt="Diamond Travel" width="150" height="122">
      <span class="crm-tag">CRM · Cúcuta</span>
    </div>
    <nav id="railNav"></nav>
    <div class="me" id="meRail"></div>
  </aside>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header class="topbar">
      <div class="brand">
        <img class="logo-top" src="assets/logo.png" alt="Diamond Travel" width="54" height="44">
        <span class="crm-tag">CRM</span>
      </div>
      <div class="me" id="meTop"></div>
    </header>
    <main><div class="wrap" id="view"></div></main>
  </div>
</div>
<nav class="tabs" id="tabNav" aria-label="Menú principal" hidden></nav>
<div id="overlayRoot"></div>
<div id="toastRoot"></div>
<script src="js/config.js"></script>
<script src="js/cotizador.js"></script>
<script src="js/app.js"></script>
</body>
</html>
